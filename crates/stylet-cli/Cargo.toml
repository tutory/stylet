[package]
name = "stylet-cli"
description = "Command-line interface for stylet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "stylet"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
stylet-resolve.workspace = true
stylet-compile.workspace = true
stylet-fmt.workspace = true
stylet-migrate.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
notify = "8.2.0"
stylet-syntax.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

name: Release

# Push a tag `vX.Y.Z` (matching the workspace version in Cargo.toml) to build
# the binaries, publish the npm packages and create a GitHub release.
on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the Cargo.toml version $cargo_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: darwin-arm64, target: aarch64-apple-darwin, runner: macos-14 }
          - { name: darwin-x64, target: x86_64-apple-darwin, runner: macos-14 }
          - { name: linux-x64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { name: linux-arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { name: win32-x64, target: x86_64-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p stylet-cli --target ${{ matrix.target }}
      - name: Collect
        shell: bash
        run: |
          exe=stylet; [ "${{ runner.os }}" = Windows ] && exe=stylet.exe
          mkdir -p dist/${{ matrix.name }}
          cp target/${{ matrix.target }}/release/$exe dist/${{ matrix.name }}/
      - uses: actions/upload-artifact@v4
        with:
          name: stylet-${{ matrix.name }}
          path: dist/${{ matrix.name }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: stylet-*
      - name: Strip artifact prefixes
        run: for d in binaries/stylet-*; do mv "$d" "binaries/${d#binaries/stylet-}"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: node npm/build.mjs ${{ needs.version.outputs.version }} binaries
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag=latest
          case "${{ needs.version.outputs.version }}" in *-*) tag=next ;; esac
          # Platform packages first, so the main package never points at missing ones.
          for dir in npm/dist/stylet-* npm/dist/stylet; do
            npm publish "$dir" --access public --provenance --tag "$tag"
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd binaries
          for d in */; do
            name=${d%/}
            if [ -f "$name/stylet.exe" ]; then
              (cd "$name" && zip -q "../stylet-$name.zip" stylet.exe)
            else
              chmod +x "$name/stylet"
              tar -czf "stylet-$name.tar.gz" -C "$name" stylet
            fi
          done
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --generate-notes $prerelease stylet-*.tar.gz stylet-*.zip

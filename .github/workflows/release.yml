name: Release

# Start it from the Actions tab ("Run workflow") or with
#   gh workflow run release.yml -f version=0.2.0
# It sets the version, commits and tags it on main, builds the binaries,
# publishes the npm packages and creates a GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.2.0 or 0.2.0-beta.1 (a prerelease)
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

concurrency: release

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and tag
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version="${VERSION#v}"
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' isn't a version like 0.2.0 or 0.2.0-beta.1"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          perl -0pi -e "s/^version = \".*?\"/version = \"$VERSION\"/m" Cargo.toml
          cargo update --workspace --quiet
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push -q origin main "v$VERSION"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: darwin-arm64, target: aarch64-apple-darwin, runner: macos-14 }
          - { name: darwin-x64, target: x86_64-apple-darwin, runner: macos-14 }
          - { name: linux-x64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { name: linux-arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { name: win32-x64, target: x86_64-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p stylet-cli --target ${{ matrix.target }}
      - name: Collect
        shell: bash
        run: |
          exe=stylet; [ "${{ runner.os }}" = Windows ] && exe=stylet.exe
          mkdir -p dist/${{ matrix.name }}
          cp target/${{ matrix.target }}/release/$exe dist/${{ matrix.name }}/
      - uses: actions/upload-artifact@v4
        with:
          name: stylet-${{ matrix.name }}
          path: dist/${{ matrix.name }}

  vscode:
    needs: [version, build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: stylet-*
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The marketplaces only take X.Y.Z; prereleases are packaged as
          # pre-release VSIXes for the GitHub release only.
          npm version --no-git-tag-version --allow-same-version "${VERSION%%-*}"
          flags=--no-dependencies
          case "$VERSION" in *-*) flags="$flags --pre-release" ;; esac
          mkdir -p ../../vsix
          # One VSIX per platform with its binary; alpine uses the static linux ones.
          for pair in darwin-arm64:darwin-arm64 darwin-x64:darwin-x64 linux-x64:linux-x64 \
                      linux-arm64:linux-arm64 alpine-x64:linux-x64 alpine-arm64:linux-arm64 \
                      win32-x64:win32-x64; do
            target=${pair%%:*} binary=${pair#*:}
            rm -rf bin && mkdir bin
            cp ../../binaries/stylet-$binary/stylet* bin/
            chmod +x bin/*
            npx vsce package $flags --target "$target" -o "../../vsix/stylet-$target.vsix"
          done
          # Other platforms: no binary (uses the workspace's package or PATH).
          rm -rf bin
          npx vsce package $flags -o ../../vsix/stylet-universal.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vsix
      - name: Publish to the VS Code Marketplace
        if: ${{ !contains(needs.version.outputs.version, '-') }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::warning::VSCE_PAT isn't set; not published to the VS Code Marketplace"; exit 0; fi
          npx vsce publish --skip-duplicate --packagePath ../../vsix/*.vsix
      - name: Publish to Open VSX
        if: ${{ !contains(needs.version.outputs.version, '-') }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::warning::OVSX_PAT isn't set; not published to Open VSX"; exit 0; fi
          npx -y ovsx publish --skip-duplicate --packagePath ../../vsix/*.vsix

  publish:
    needs: [version, build, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: stylet-*
      - name: Strip artifact prefixes
        run: for d in binaries/stylet-*; do mv "$d" "binaries/${d#binaries/stylet-}"; done
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: node npm/build.mjs ${{ needs.version.outputs.version }} binaries
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag=latest
          case "${{ needs.version.outputs.version }}" in *-*) tag=next ;; esac
          # Platform packages first, so the main package never points at missing ones.
          # Already published ones are skipped, so a failed run can be re-run.
          for dir in npm/dist/stylet-* npm/dist/stylet; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@${{ needs.version.outputs.version }}" version >/dev/null 2>&1; then
              echo "$name@${{ needs.version.outputs.version }} is already published"
              continue
            fi
            npm publish "$dir" --access public --provenance --tag "$tag"
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd binaries
          for d in */; do
            name=${d%/}
            if [ -f "$name/stylet.exe" ]; then
              (cd "$name" && zip -q "../stylet-$name.zip" stylet.exe)
            else
              chmod +x "$name/stylet"
              tar -czf "stylet-$name.tar.gz" -C "$name" stylet
            fi
          done
          tag=${{ needs.version.outputs.tag }}
          prerelease=""
          case "$tag" in *-*) prerelease=--prerelease ;; esac
          gh release create "$tag" --generate-notes $prerelease stylet-*.tar.gz stylet-*.zip ../vsix/*.vsix

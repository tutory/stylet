[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tutory/stylet"

[workspace.dependencies]
stylet-syntax = { path = "crates/stylet-syntax" }
stylet-resolve = { path = "crates/stylet-resolve" }
stylet-compile = { path = "crates/stylet-compile" }
stylet-fmt = { path = "crates/stylet-fmt" }
stylet-migrate = { path = "crates/stylet-migrate" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
